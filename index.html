<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>サンタの帽子カメラ - 単一ファイル版</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
/* リセットと基本スタイル */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    line-height: 1.6;
    color: #333;
    background: linear-gradient(135deg, #1a2a3a 0%, #2c3e50 100%);
    min-height: 100vh;
    padding: 20px;
}

.container {
    max-width: 1400px;
    margin: 0 auto;
    background-color: rgba(255, 255, 255, 0.95);
    border-radius: 20px;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
    overflow: hidden;
    padding: 30px;
}

/* ヘッダー */
header {
    text-align: center;
    margin-bottom: 30px;
    padding-bottom: 20px;
    border-bottom: 3px solid #e74c3c;
}

header h1 {
    color: #2c3e50;
    font-size: 2.8rem;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
}

header h1 i {
    color: #e74c3c;
}

.subtitle {
    color: #7f8c8d;
    font-size: 1.2rem;
    font-weight: 300;
}

/* メインコンテンツ */
.app-container {
    display: grid;
    grid-template-columns: 1fr 400px;
    gap: 30px;
    margin-bottom: 30px;
}

@media (max-width: 1024px) {
    .app-container {
        grid-template-columns: 1fr;
    }
}

/* カメラセクション */
.camera-section {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.video-container {
    position: relative;
    width: 100%;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    background: #000;
}

video {
    width: 100%;
    height: auto;
    display: block;
    transform: scaleX(-1); /* ミラー表示 */
}

.video-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

#overlay {
    width: 100%;
    height: 100%;
}

.controls {
    display: flex;
    gap: 15px;
    justify-content: center;
    flex-wrap: wrap;
}

/* ボタン */
.btn {
    padding: 12px 25px;
    border: none;
    border-radius: 50px;
    font-size: 1.1rem;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: all 0.3s ease;
    min-width: 160px;
}

.btn-primary {
    background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
    color: white;
}

.btn-primary:hover {
    background: linear-gradient(135deg, #2980b9 0%, #1c5a7a 100%);
    transform: translateY(-3px);
    box-shadow: 0 7px 15px rgba(41, 128, 185, 0.4);
}

.btn-secondary {
    background: linear-gradient(135deg, #95a5a6 0%, #7f8c8d 100%);
    color: white;
}

.btn-secondary:hover {
    background: linear-gradient(135deg, #7f8c8d 0%, #636e72 100%);
    transform: translateY(-3px);
    box-shadow: 0 7px 15px rgba(127, 140, 141, 0.4);
}

.btn-success {
    background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
    color: white;
}

.btn-success:hover {
    background: linear-gradient(135deg, #27ae60 0%, #219653 100%);
    transform: translateY(-3px);
    box-shadow: 0 7px 15px rgba(46, 204, 113, 0.4);
}

.btn-info {
    background: linear-gradient(135deg, #9b59b6 0%, #8e44ad 100%);
    color: white;
}

.btn-info:hover {
    background: linear-gradient(135deg, #8e44ad 0%, #7d3c98 100%);
    transform: translateY(-3px);
    box-shadow: 0 7px 15px rgba(155, 89, 182, 0.4);
}

.btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none !important;
    box-shadow: none !important;
}

/* 設定セクション */
.settings-section {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.card {
    background: white;
    border-radius: 15px;
    padding: 25px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
    border: 1px solid #e0e0e0;
}

.card h3 {
    color: #2c3e50;
    margin-bottom: 20px;
    font-size: 1.5rem;
    display: flex;
    align-items: center;
    gap: 10px;
    padding-bottom: 15px;
    border-bottom: 2px solid #f1f1f1;
}

/* 設定グループ */
.setting-group {
    margin-bottom: 25px;
}

.setting-group label {
    display: block;
    margin-bottom: 10px;
    font-weight: 600;
    color: #34495e;
    font-size: 1.1rem;
    display: flex;
    align-items: center;
    gap: 10px;
}

/* 帽子オプション */
.hat-options {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.hat-option {
    border: 2px solid #ddd;
    border-radius: 10px;
    padding: 15px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
}

.hat-option:hover {
    border-color: #3498db;
    transform: translateY(-5px);
    box-shadow: 0 5px 15px rgba(52, 152, 219, 0.2);
}

.hat-option.active {
    border-color: #e74c3c;
    background-color: rgba(231, 76, 60, 0.05);
}

.hat-option img {
    width: 80px;
    height: 80px;
    object-fit: contain;
}

.hat-option i {
    font-size: 2.5rem;
    color: #7f8c8d;
}

.hat-option span {
    font-weight: 600;
    color: #2c3e50;
}

/* フォーム要素 */
.form-select {
    width: 100%;
    padding: 12px 15px;
    border: 2px solid #ddd;
    border-radius: 10px;
    font-size: 1rem;
    background-color: white;
    color: #333;
    transition: border-color 0.3s;
}

.form-select:focus {
    outline: none;
    border-color: #3498db;
}

.slider {
    width: 100%;
    height: 10px;
    border-radius: 5px;
    background: #ddd;
    outline: none;
    margin: 15px 0;
}

.slider::-webkit-slider-thumb {
    appearance: none;
    width: 25px;
    height: 25px;
    border-radius: 50%;
    background: #e74c3c;
    cursor: pointer;
}

#hatSizeValue {
    display: inline-block;
    margin-left: 15px;
    font-weight: 600;
    color: #e74c3c;
    min-width: 50px;
}

/* 統計 */
.stats {
    margin-top: 25px;
    padding-top: 20px;
    border-top: 2px solid #f1f1f1;
}

.stats h4 {
    margin-bottom: 15px;
    color: #2c3e50;
    display: flex;
    align-items: center;
    gap: 10px;
}

.stat-item {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
    padding: 8px 0;
    border-bottom: 1px dashed #eee;
}

.stat-item:last-child {
    border-bottom: none;
}

.stat-item span:first-child {
    color: #7f8c8d;
}

.stat-item span:last-child {
    font-weight: 700;
    color: #2c3e50;
    font-size: 1.2rem;
}

/* 使い方 */
.instructions ol {
    margin-left: 20px;
    margin-bottom: 15px;
}

.instructions li {
    margin-bottom: 10px;
    color: #555;
}

.note {
    background-color: #fff9e6;
    border-left: 4px solid #f1c40f;
    padding: 15px;
    border-radius: 0 8px 8px 0;
    margin-top: 15px;
    color: #7d6608;
    display: flex;
    align-items: flex-start;
    gap: 10px;
}

.note i {
    color: #f1c40f;
    margin-top: 2px;
}

/* フッター */
footer {
    text-align: center;
    padding-top: 25px;
    border-top: 2px solid #eee;
    color: #7f8c8d;
    font-size: 0.9rem;
}

.tech-info {
    margin-top: 10px;
    font-size: 0.8rem;
    color: #95a5a6;
}

/* レスポンシブ調整 */
@media (max-width: 768px) {
    .container {
        padding: 15px;
    }
    
    header h1 {
        font-size: 2rem;
        flex-direction: column;
        gap: 10px;
    }
    
    .btn {
        min-width: 140px;
        padding: 10px 20px;
    }
    
    .hat-options {
        grid-template-columns: 1fr;
    }
}

/* アニメーション */
@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
}

.pulse {
    animation: pulse 0.5s ease-in-out;
}

/* 検出ボックス */
.face-box {
    position: absolute;
    border: 3px solid #e74c3c;
    border-radius: 10px;
    background-color: rgba(231, 76, 60, 0.1);
    pointer-events: none;
}

.face-label {
    position: absolute;
    top: -30px;
    left: 0;
    background-color: #e74c3c;
    color: white;
    padding: 3px 10px;
    border-radius: 5px;
    font-size: 0.9rem;
    font-weight: bold;
}
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-santa-hat"></i> サンタの帽子カメラ</h1>
            <p class="subtitle">Webカメラで顔を検出してサンタの帽子を被せよう！</p>
        </header>

        <main>
            <div class="app-container">
                <div class="camera-section">
                    <div class="video-container">
                        <video id="video" width="640" height="480" autoplay muted playsinline></video>
                        <div class="video-overlay">
                            <canvas id="overlay"></canvas>
                        </div>
                    </div>
                    <div class="controls">
                        <button id="startBtn" class="btn btn-primary">
                            <i class="fas fa-play"></i> カメラ開始
                        </button>
                        <button id="stopBtn" class="btn btn-secondary" disabled>
                            <i class="fas fa-stop"></i> カメラ停止
                        </button>
                        <button id="switchCameraBtn" class="btn btn-info" disabled>
                            <i class="fas fa-camera-retro"></i> カメラ切替
                        </button>
                        <button id="screenshotBtn" class="btn btn-success" disabled>
                            <i class="fas fa-camera"></i> スクリーンショット
                        </button>
                    </div>
                </div>

                <div class="settings-section">
                    <div class="instructions card">
                        <h3><i class="fas fa-info-circle"></i> 使い方</h3>
                        <ol>
                            <li>「カメラ開始」ボタンをクリックしてカメラへのアクセスを許可</li>
                            <li>顔が自動的に検出され、帽子が被せられます</li>
                            <li>「スクリーンショット」で画像を保存</li>
                            <li>「カメラ停止」で処理を終了</li>
                        </ol>
                        <p class="note"><i class="fas fa-lightbulb"></i> ヒント: 明るい環境で正面を向くと検出精度が向上します</p>
                        
                        <div class="stats">
                            <h4><i class="fas fa-chart-bar"></i> 統計</h4>
                            <div class="stat-item">
                                <span>検出された顔:</span>
                                <span id="faceCount">0</span>
                            </div>
                            <div class="stat-item">
                                <span>FPS:</span>
                                <span id="fps">0</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer>
            <p>© 2023 サンタの帽子カメラ - Python版から移植</p>
            <p class="tech-info">技術: HTML5, CSS3, JavaScript, MediaPipe Face Landmarker, Canvas API</p>
        </footer>
    </div>

    <!-- スクリーンショット用の隠しCanvas -->
    <canvas id="screenshotCanvas" style="display: none;"></canvas>

    <!-- MediaPipe Tasks Vision -->
    <script type="module">
        // MediaPipe Tasks VisionをESモジュールとしてインポート
        import { FaceLandmarker, FilesetResolver } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/vision_bundle.mjs';
        
        // グローバルに公開
        window.FaceLandmarker = FaceLandmarker;
        window.FilesetResolver = FilesetResolver;
        console.log('MediaPipe Tasks Vision 読み込み完了');
    </script>
    
    <!-- カメラユーティリティ（必要に応じて） -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    
    <!-- アプリケーションスクリプト -->
    <script>
// クリスマス帽子カメラ - メインアプリケーション（MediaPipe Face Landmarker版）
class ChristmasHatCamera {
    constructor() {
        // DOM要素
        this.video = document.getElementById('video');
        this.overlay = document.getElementById('overlay');
        this.startBtn = document.getElementById('startBtn');
        this.stopBtn = document.getElementById('stopBtn');
        this.switchCameraBtn = document.getElementById('switchCameraBtn');
        this.screenshotBtn = document.getElementById('screenshotBtn');
        this.faceCountElement = document.getElementById('faceCount');
        this.fpsElement = document.getElementById('fps');
        
        // アプリケーション状態
        this.isRunning = false;
        this.cameraMode = 'user'; // 'user' = 前面カメラ, 'environment' = 背面カメラ
        this.selectedHat = '1'; // デフォルトで帽子1に固定
        this.hatSize = 1.0; // 100%に固定
        this.hatImages = {};
        this.faces = [];
        this.lastTimestamp = 0;
        this.frameCount = 0;
        this.fps = 0;
        this.faceLandmarker = null;
        this.lastVideoTime = -1;
        this.animationFrameId = null;
        
        // Canvasコンテキスト
        this.overlayCtx = this.overlay.getContext('2d');
        this.screenshotCanvas = document.getElementById('screenshotCanvas');
        this.screenshotCtx = this.screenshotCanvas.getContext('2d');
        
        // 初期化
        this.init();
    }
    
    async init() {
        console.log('クリスマス帽子カメラを初期化中... (MediaPipe Face Landmarker版)');
        
        // イベントリスナーの設定
        this.setupEventListeners();
        
        // 帽子画像の読み込み
        await this.loadHatImages();
        
        // MediaPipe Face Landmarkerの初期化
        await this.initFaceLandmarker();
        
        // UIの初期状態を設定
        this.updateUI();
        
        console.log('初期化完了');
    }
    
    setupEventListeners() {
        // カメラ開始ボタン
        this.startBtn.addEventListener('click', () => this.startCamera());
        
        // カメラ停止ボタン
        this.stopBtn.addEventListener('click', () => this.stopCamera());
        
        // カメラ切り替えボタン
        this.switchCameraBtn.addEventListener('click', () => this.switchCamera());
        
        // スクリーンショットボタン
        this.screenshotBtn.addEventListener('click', () => this.takeScreenshot());
    }
    
    async loadHatImages() {
        console.log('帽子画像を読み込み中...');
        
        const hatPromises = [1, 2, 3].map(num => {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.src = `hat_${num}.png`;
                img.onload = () => {
                    this.hatImages[num] = img;
                    console.log(`帽子${num}を読み込み完了: ${img.width}x${img.height}`);
                    resolve();
                };
                img.onerror = reject;
            });
        });
        
        await Promise.all(hatPromises);
        console.log('すべての帽子画像を読み込み完了');
    }
    
    async initFaceLandmarker() {
        console.log('MediaPipe Face Landmarkerを初期化中...');
        
        try {
            // FaceLandmarkerが利用可能か確認
            if (typeof FaceLandmarker === 'undefined' || typeof FilesetResolver === 'undefined') {
                throw new Error('MediaPipe Tasks Visionライブラリが読み込まれていません');
            }
            
            // FilesetResolverでVision Tasksを初期化
            const vision = await FilesetResolver.forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/wasm"
            );
            
            // FaceLandmarkerの作成（高速モード削除、標準設定のみ）
            this.faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
                    delegate: "GPU"
                },
                outputFaceBlendshapes: false,
                outputFacialTransformationMatrixes: false,
                runningMode: "VIDEO",
                numFaces: 10 // 最大4つの顔を検出
            });
            
            console.log('MediaPipe Face Landmarker初期化完了');
        } catch (error) {
            console.error('MediaPipe Face Landmarkerの初期化に失敗しました:', error);
            console.error('エラーの詳細:', error.message);
            
            // フォールバック：簡易な顔検出モード
            console.log('簡易顔検出モードにフォールバックします');
            this.faceLandmarker = null;
            alert('MediaPipe Face Landmarkerの初期化に失敗しました。簡易モードで続行します。');
        }
    }
    
    async startCamera() {
        if (this.isRunning) return;
        
        console.log('カメラを起動中... (モード: ' + this.cameraMode + ')');
        
        try {
            // カメラストリームの取得（現在のカメラモードを使用）
            const constraints = {
                video: {
                    width: { ideal: 640 },
                    height: { ideal: 480 },
                    facingMode: this.cameraMode
                },
                audio: false
            };
            
            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            
            this.video.srcObject = stream;
            this.isRunning = true;
            
            // オーバーレイCanvasのサイズをビデオに合わせる
            this.video.onloadedmetadata = () => {
                this.overlay.width = this.video.videoWidth;
                this.overlay.height = this.video.videoHeight;
                this.screenshotCanvas.width = this.video.videoWidth;
                this.screenshotCanvas.height = this.video.videoHeight;
                
                // 処理ループを開始
                this.processFrame();
            };
            
            // UIを更新
            this.updateUI();
            console.log('カメラ起動完了 (モード: ' + this.cameraMode + ')');
            
        } catch (error) {
            console.error('カメラの起動に失敗しました:', error);
            alert('カメラへのアクセスに失敗しました。カメラが接続されているか確認してください。\nエラー: ' + error.message);
        }
    }
    
    stopCamera() {
        if (!this.isRunning) return;
        
        console.log('カメラを停止中...');
        
        // アニメーションフレームをキャンセル
        if (this.animationFrameId) {
            cancelAnimationFrame(this.animationFrameId);
            this.animationFrameId = null;
        }
        
        // ストリームを停止
        const stream = this.video.srcObject;
        if (stream) {
            const tracks = stream.getTracks();
            tracks.forEach(track => track.stop());
            this.video.srcObject = null;
        }
        
        this.isRunning = false;
        this.faces = [];
        this.lastVideoTime = -1;
        this.lastTimestamp = 0;
        this.frameCount = 0;
        
        // オーバーレイをクリア
        this.overlayCtx.clearRect(0, 0, this.overlay.width, this.overlay.height);
        
        // UIを更新
        this.updateUI();
        console.log('カメラ停止完了');
    }
    
    // カメラ切り替え
    async switchCamera() {
        if (!this.isRunning) {
            // カメラが起動していない場合は単にモードを切り替える
            this.cameraMode = this.cameraMode === 'user' ? 'environment' : 'user';
            console.log('カメラモードを切り替え: ' + this.cameraMode);
            this.updateUI();
            return;
        }
        
        console.log('カメラを切り替え中... (現在のモード: ' + this.cameraMode + ')');
        
        // 現在のストリームを停止
        const wasRunning = this.isRunning;
        if (wasRunning) {
            this.stopCamera();
        }
        
        // カメラモードを切り替え
        this.cameraMode = this.cameraMode === 'user' ? 'environment' : 'user';
        console.log('カメラモードを切り替え: ' + this.cameraMode);
        
        // カメラを再起動
        if (wasRunning) {
            await this.startCamera();
        }
        
        this.updateUI();
    }
    
    // 帽子選択メソッド（UI削除のため簡略化）
    selectHat(hat) {
        this.selectedHat = hat;
        console.log(`帽子を選択: ${hat}`);
    }
    
    async processFrame() {
        if (!this.isRunning) return;
        
        // FPS計算
        const now = performance.now();
        this.frameCount++;
        
        if (this.lastTimestamp && now - this.lastTimestamp >= 1000) {
            this.fps = Math.round((this.frameCount * 1000) / (now - this.lastTimestamp));
            this.fpsElement.textContent = this.fps;
            this.frameCount = 0;
            this.lastTimestamp = now;
        } else if (!this.lastTimestamp) {
            this.lastTimestamp = now;
        }
        
        // 顔検出（約30fpsに制限）
        const currentTime = performance.now();
        if (currentTime - this.lastVideoTime >= 33) { // ~30fps
            this.lastVideoTime = currentTime;
            
            if (this.faceLandmarker) {
                await this.detectFaces(currentTime);
            } else {
                // 簡易モード：固定位置に帽子を表示（デモ用）
                this.faces = [{
                    x: this.overlay.width * 0.3,
                    y: this.overlay.height * 0.3,
                    width: this.overlay.width * 0.4,
                    height: this.overlay.height * 0.4
                }];
                this.faceCountElement.textContent = '1';
            }
            
            // 帽子を描画
            this.drawHats();
        }
        
        // 次のフレームを処理
        this.animationFrameId = requestAnimationFrame(() => this.processFrame());
    }
    
    async detectFaces(currentTime) {
        if (!this.faceLandmarker || !this.isRunning) return;
        
        try {
            // 顔検出を実行
            const results = this.faceLandmarker.detectForVideo(this.video, currentTime);
            
            if (results.faceLandmarks && results.faceLandmarks.length > 0) {
                // 検出結果を処理
                this.faces = results.faceLandmarks.map(landmarks => {
                    // 顔のバウンディングボックスを計算
                    const bounds = this.calculateFaceBounds(landmarks);
                    return {
                        x: bounds.x,
                        y: bounds.y,
                        width: bounds.width,
                        height: bounds.height,
                        landmarks: landmarks
                    };
                });
                
                // 顔の数を更新
                this.faceCountElement.textContent = this.faces.length;
            } else {
                this.faces = [];
                this.faceCountElement.textContent = '0';
            }
        } catch (error) {
            console.error('顔検出エラー:', error);
            this.faces = [];
        }
    }
    
    calculateFaceBounds(landmarks) {
        let minX = Infinity, minY = Infinity;
        let maxX = -Infinity, maxY = -Infinity;
        
        for (const landmark of landmarks) {
            const x = landmark.x * this.overlay.width;
            const y = landmark.y * this.overlay.height;
            
            minX = Math.min(minX, x);
            minY = Math.min(minY, y);
            maxX = Math.max(maxX, x);
            maxY = Math.max(maxY, y);
        }
        
        // バウンディングボックスを少し拡大
        const padding = 10;
        return {
            x: minX - padding,
            y: minY - padding,
            width: (maxX - minX) + padding * 2,
            height: (maxY - minY) + padding * 2
        };
    }
    
    drawFaceBoxes(results) {
        // オーバーレイをクリア
        this.overlayCtx.clearRect(0, 0, this.overlay.width, this.overlay.height);
        
        // 顔のバウンディングボックスを描画
        this.overlayCtx.strokeStyle = '#e74c3c';
        this.overlayCtx.lineWidth = 2;
        this.overlayCtx.fillStyle = 'rgba(231, 76, 60, 0.1)';
        
        for (const face of this.faces) {
            this.overlayCtx.strokeRect(face.x, face.y, face.width, face.height);
            this.overlayCtx.fillRect(face.x, face.y, face.width, face.height);
        }
    }
    
    drawHats() {
        // オーバーレイをクリア（残像防止）
        this.overlayCtx.clearRect(0, 0, this.overlay.width, this.overlay.height);
        
        // 各顔に帽子を描画
        this.faces.forEach(face => {
            this.drawHatOnFace(face);
        });
    }
    
    drawHatOnFace(face) {
        // 使用する帽子を決定
        let hatImg;
        if (this.selectedHat === 'random') {
            const randomHat = Math.floor(Math.random() * 3) + 1;
            hatImg = this.hatImages[randomHat];
        } else {
            hatImg = this.hatImages[this.selectedHat];
        }
        
        if (!hatImg) return;
        
        // 帽子のサイズを計算（顔の幅に合わせて調整）
        const hatWidth = face.width * 1.5 * this.hatSize;
        const hatHeight = (hatImg.height / hatImg.width) * hatWidth;
        
        // 帽子の位置を計算（顔の上部中央）
        // ビデオはCSSでミラー表示されているため、X座標を反転
        const mirroredX = this.overlay.width - face.x - face.width;
        const hatX = mirroredX + face.width / 2 - hatWidth / 2;
        const hatY = face.y - hatHeight * 0.5;
        
        // 帽子を描画（ミラー補正なし）
        this.overlayCtx.drawImage(hatImg, hatX, hatY, hatWidth, hatHeight);
    }
    
    takeScreenshot() {
        if (!this.isRunning || this.faces.length === 0) {
            alert('カメラが起動中で、顔が検出されている状態でスクリーンショットを撮影してください。');
            return;
        }
        
        // スクリーンショット用Canvasに現在のフレームを描画
        this.screenshotCtx.save();
        
        // ビデオを描画（ミラー反転なし - CSSでミラー表示されているため）
        this.screenshotCtx.drawImage(this.video, 0, 0, this.video.videoWidth, this.video.videoHeight);
        
        // 帽子を描画
        this.faces.forEach(face => {
            this.drawHatOnScreenshot(face);
        });
        
        this.screenshotCtx.restore();
        
        // 画像としてダウンロード
        const link = document.createElement('a');
        link.download = `christmas_hat_${new Date().getTime()}.png`;
        link.href = this.screenshotCanvas.toDataURL('image/png');
        link.click();
        
        console.log('スクリーンショットを保存しました');
    }
    
    drawHatOnScreenshot(face) {
        // 帽子の選択（スクリーンショット用）
        let hatImg;
        if (this.selectedHat === 'random') {
            const randomHat = Math.floor(Math.random() * 3) + 1;
            hatImg = this.hatImages[randomHat];
        } else {
            hatImg = this.hatImages[this.selectedHat];
        }
        
        if (!hatImg) return;
        
        // 帽子のサイズを計算
        const hatWidth = face.width * 1.5 * this.hatSize;
        const hatHeight = (hatImg.height / hatImg.width) * hatWidth;
        
        // 帽子の位置を計算（スクリーンショットはミラー表示なし）
        const hatX = face.x + face.width / 2 - hatWidth / 2;
        const hatY = face.y - hatHeight * 0.5;
        
        // 帽子を描画（ミラー補正なし）
        this.screenshotCtx.drawImage(hatImg, hatX, hatY, hatWidth, hatHeight);
    }
    
    updateUI() {
        // ボタンの状態を更新
        this.startBtn.disabled = this.isRunning;
        this.stopBtn.disabled = !this.isRunning;
        this.switchCameraBtn.disabled = !this.isRunning;
        this.screenshotBtn.disabled = !this.isRunning;
        
        // ボタンのテキストを更新
        this.startBtn.innerHTML = this.isRunning 
            ? '<i class="fas fa-play"></i> 実行中' 
            : '<i class="fas fa-play"></i> カメラ開始';
        
        this.stopBtn.innerHTML = this.isRunning
            ? '<i class="fas fa-stop"></i> カメラ停止'
            : '<i class="fas fa-stop"></i> 停止中';
        
        // カメラ切り替えボタンのテキストを更新
        const cameraModeText = this.cameraMode === 'user' ? '前面カメラ' : '背面カメラ';
        this.switchCameraBtn.innerHTML = this.isRunning
            ? `<i class="fas fa-camera-retro"></i> カメラ切替 (${cameraModeText})`
            : `<i class="fas fa-camera-retro"></i> カメラ切替 (${cameraModeText})`;
    }
}

    window.app = new ChristmasHatCamera();

    console.log('- app.stopCamera(): カメラを停止');

});
